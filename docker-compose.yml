services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mezon-personal-os-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-password123}@db:5432/mezon_sprint_os?schema=public
      - JWT_SECRET=${JWT_SECRET:-mezon-super-secret-jwt-token-change-in-prod}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - S3_BUCKET=${S3_BUCKET:-mezon-sprint-media}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://r2.storage.school.mezon}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - MEDIA_PUBLIC_URL=${MEDIA_PUBLIC_URL:-http://localhost:3000/api/v1/media/files}
      - SEED_ON_START=${SEED_ON_START:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:17-alpine
    container_name: mezon-personal-os-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: mezon_sprint_os
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mezon_sprint_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
